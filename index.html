<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szopy som najlepsze</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1e1e2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        img {
            max-width: 90%;
            width: 500px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .ruchomy-napis {
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            animation: bujanie 1.5s infinite ease-in-out alternate;
        }

        @keyframes bujanie {
            0% {
                transform: translateX(-30px) rotate(-5deg) scale(1);
                color: #ff9f43;
            }
            100% {
                transform: translateX(30px) rotate(5deg) scale(1.1);
                color: #0abde3;
            }
        }
    </style>
</head>
<body>

    <img src="https://thumbs.dreamstime.com/b/very-obese-racoon-urban-backyard-quebec-heart-residential-neighborhood-197832465.jpg?w=450" alt="Słodki szop pracz">
    
    <div class="ruchomy-napis">Szopy som najlepsze</div>

</body>
</html>
